<svg viewBox="0 0 560 250" width="560" height="250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="계층 질의 트리. START WITH로 루트를 정하고 CONNECT BY PRIOR로 부모 자식을 전개하며 LEVEL은 깊이를 나타낸다">
  <defs>
    <style>
      .cap{font:800 14px 'Nanum Gothic',sans-serif;fill:#17324c}
      .node{stroke:#17324c;stroke-width:1.5;fill:#fff}
      .root{fill:#fff6d6}
      .t{font:800 12px 'Nanum Gothic',sans-serif;fill:#17324c;text-anchor:middle}
      .ln{stroke:#17324c;stroke-width:1.4}
      .lv{font:700 11px 'IBM Plex Mono',monospace;fill:#3b5bdb;text-anchor:end}
      .note{font:400 11px 'IBM Plex Mono',monospace;fill:#4a6580}
    </style>
  </defs>

  <text class="cap" x="24" y="26">계층 질의 — 트리 전개</text>

  <!-- level lines -->
  <line class="ln" x1="245" y1="66" x2="180" y2="106"/>
  <line class="ln" x1="245" y1="66" x2="310" y2="106"/>
  <line class="ln" x1="180" y1="126" x2="140" y2="166"/>
  <line class="ln" x1="180" y1="126" x2="220" y2="166"/>

  <rect class="node root" x="205" y="44" width="90" height="26" rx="8"/><text class="t" x="250" y="62">사장</text>
  <rect class="node" x="140" y="106" width="90" height="26" rx="8"/><text class="t" x="185" y="124">영업이사</text>
  <rect class="node" x="270" y="106" width="90" height="26" rx="8"/><text class="t" x="315" y="124">인사이사</text>
  <rect class="node" x="100" y="166" width="80" height="26" rx="8"/><text class="t" x="140" y="184">김대리</text>
  <rect class="node" x="188" y="166" width="80" height="26" rx="8"/><text class="t" x="228" y="184">이사원</text>

  <text class="lv" x="470" y="62">LEVEL 1 (START WITH)</text>
  <text class="lv" x="470" y="124">LEVEL 2</text>
  <text class="lv" x="470" y="184">LEVEL 3</text>

  <text class="note" x="24" y="220">※ START WITH=루트(관리자 없음), CONNECT BY PRIOR 사원=관리자 → 위에서 아래로 전개.</text>
  <text class="note" x="24" y="240">   PRIOR 위치가 전개 방향을 결정. LEVEL=깊이(1부터).</text>
</svg>
