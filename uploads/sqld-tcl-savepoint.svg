<svg viewBox="0 0 600 200" width="600" height="200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="트랜잭션 작업 A, SAVEPOINT s1, 작업 B, SAVEPOINT s2, 작업 C 순서에서 ROLLBACK TO s2는 C만 취소, ROLLBACK TO s1은 B와 C를 취소하며, COMMIT은 전부 확정한다">
  <defs>
    <style>
      .op{fill:#fff;stroke:#17324c;stroke-width:1.5}
      .opt{font:700 12px 'Nanum Gothic',sans-serif;fill:#17324c;text-anchor:middle}
      .sp{fill:#ffe066;stroke:#17324c;stroke-width:1.4}
      .spt{font:700 11px 'IBM Plex Mono',monospace;fill:#17324c;text-anchor:middle}
      .commit{fill:#1a7d45;stroke:#1a7d45}
      .committ{font:700 12px 'Nanum Gothic',sans-serif;fill:#fff;text-anchor:middle}
      .line{stroke:#17324c;stroke-width:2}
      .rb{stroke:#d62b2b;stroke-width:1.6;fill:none;stroke-dasharray:5 3}
      .rbt{font:700 11px 'Nanum Gothic',sans-serif;fill:#d62b2b}
      .note{font:400 11px 'IBM Plex Mono',monospace;fill:#4a6580}
    </style>
  </defs>

  <line class="line" x1="20" y1="60" x2="580" y2="60"/>

  <rect class="op" x="30" y="46" width="70" height="28" rx="6"/><text class="opt" x="65" y="64">작업 A</text>
  <rect class="sp" x="120" y="48" width="52" height="24" rx="12"/><text class="spt" x="146" y="64">s1</text>
  <rect class="op" x="192" y="46" width="70" height="28" rx="6"/><text class="opt" x="227" y="64">작업 B</text>
  <rect class="sp" x="282" y="48" width="52" height="24" rx="12"/><text class="spt" x="308" y="64">s2</text>
  <rect class="op" x="354" y="46" width="70" height="28" rx="6"/><text class="opt" x="389" y="64">작업 C</text>
  <rect class="commit" x="470" y="46" width="80" height="28" rx="6"/><text class="committ" x="510" y="64">COMMIT</text>

  <!-- ROLLBACK TO s2 : C 취소 -->
  <path class="rb" d="M424 82 C400 110 330 110 308 84"/>
  <text class="rbt" x="330" y="126">ROLLBACK TO s2 → 작업 C 만 취소</text>

  <!-- ROLLBACK TO s1 : B,C 취소 -->
  <path class="rb" d="M424 92 C360 150 210 150 146 90"/>
  <text class="rbt" x="250" y="166">ROLLBACK TO s1 → 작업 B·C 취소 (A 남음)</text>

  <text class="rbt" x="470" y="40" style="fill:#1a7d45">COMMIT → 전부 확정</text>

  <text x="20" y="192" class="note">※ SAVEPOINT 는 중간 저장점 · ROLLBACK TO 는 그 지점 '이후'만 취소 · COMMIT 후엔 되돌리기 불가</text>
</svg>
