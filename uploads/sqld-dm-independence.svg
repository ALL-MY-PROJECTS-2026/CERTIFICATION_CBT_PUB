<svg viewBox="0 0 560 300" width="560" height="300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ANSI 3층 스키마를 외부·개념·내부로 쌓고, 개념 스키마가 바뀌어도 외부가 안전한 것을 논리적 독립성, 내부 스키마가 바뀌어도 개념이 안전한 것을 물리적 독립성으로 화살표와 함께 표시">
  <defs>
    <style>
      .lay{stroke:#17324c;stroke-width:1.6}
      .lt{font:800 16px 'Nanum Gothic',sans-serif;fill:#17324c}
      .ls{font:400 12px 'IBM Plex Mono',monospace;fill:#4a6580}
      .bound{stroke:#9fb3c2;stroke-width:1.4;stroke-dasharray:6 4}
      .pill{fill:#e9f0ff;stroke:#3b5bdb;stroke-width:1.4}
      .pt{font:800 12.5px 'Nanum Gothic',sans-serif;fill:#22357a;text-anchor:middle}
      .note{font:400 11.5px 'IBM Plex Mono',monospace;fill:#4a6580}
    </style>
  </defs>

  <!-- 외부 스키마 -->
  <rect class="lay" x="24" y="16" width="380" height="54" rx="11" fill="#fff"/>
  <text class="lt" x="46" y="42">외부 스키마</text>
  <text class="ls" x="46" y="60">응용·사용자별 View (성적조회·수강신청…)</text>

  <!-- 경계 1: 논리적 독립성 -->
  <line class="bound" x1="24" y1="90" x2="404" y2="90"/>
  <rect class="pill" x="150" y="78" width="128" height="24" rx="12"/>
  <text class="pt" x="214" y="94">논리적 독립성</text>

  <!-- 개념 스키마 -->
  <rect class="lay" x="24" y="112" width="380" height="54" rx="11" fill="#ffe066"/>
  <text class="lt" x="46" y="138">개념 스키마</text>
  <text class="ls" x="46" y="156" style="fill:#6b5900">통합 논리 구조 · 엔터티·관계·제약</text>

  <!-- 경계 2: 물리적 독립성 -->
  <line class="bound" x1="24" y1="186" x2="404" y2="186"/>
  <rect class="pill" x="150" y="174" width="128" height="24" rx="12"/>
  <text class="pt" x="214" y="190">물리적 독립성</text>

  <!-- 내부 스키마 -->
  <rect class="lay" x="24" y="208" width="380" height="54" rx="11" fill="#fff"/>
  <text class="lt" x="46" y="234">내부 스키마</text>
  <text class="ls" x="46" y="252">파일·인덱스 (물리적 저장)</text>

  <!-- 방향 설명 -->
  <text class="note" x="424" y="52">개념 바뀌어도</text>
  <text class="note" x="424" y="68" style="fill:#2e7d32">→ 외부 안전</text>
  <text class="note" x="424" y="148">내부 바뀌어도</text>
  <text class="note" x="424" y="164" style="fill:#2e7d32">→ 개념 안전</text>

  <text x="24" y="286" class="note">※ '무엇을 바꿔도 위층이 안전한가'로 외운다 — 개념→외부=논리, 내부→개념=물리.</text>
</svg>
