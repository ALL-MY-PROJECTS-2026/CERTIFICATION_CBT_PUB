<svg viewBox="0 0 560 250" width="560" height="250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="집합 연산자 네 가지. UNION은 합집합 중복 제거, UNION ALL은 중복 유지, INTERSECT는 교집합, MINUS는 차집합">
  <defs>
    <style>
      .cap{font:800 14px 'Nanum Gothic',sans-serif;fill:#17324c}
      .box{stroke:#17324c;stroke-width:1.5;fill:#fff}
      .t{font:800 12.5px 'IBM Plex Mono',monospace;fill:#17324c;text-anchor:middle}
      .s{font:400 10.5px 'Nanum Gothic',sans-serif;fill:#4a6580;text-anchor:middle}
      .ca{fill:#dbe7f3;stroke:#17324c;stroke-width:1.2}
      .cb{fill:#ffe9c7;stroke:#17324c;stroke-width:1.2}
      .note{font:400 11px 'IBM Plex Mono',monospace;fill:#4a6580}
    </style>
  </defs>

  <text class="cap" x="24" y="26">집합 연산자 4종</text>

  <!-- UNION -->
  <text class="t" x="90" y="52">UNION</text>
  <circle class="ca" cx="78" cy="86" r="24"/><circle class="cb" cx="102" cy="86" r="24"/>
  <text class="s" x="90" y="128">합집합 · 중복 제거·정렬</text>

  <!-- UNION ALL -->
  <text class="t" x="235" y="52">UNION ALL</text>
  <circle class="ca" cx="223" cy="86" r="24"/><circle class="cb" cx="247" cy="86" r="24"/>
  <text class="s" x="235" y="128">합집합 · 중복 유지(빠름)</text>

  <!-- INTERSECT -->
  <text class="t" x="380" y="52">INTERSECT</text>
  <circle class="ca" cx="368" cy="86" r="24"/><circle class="cb" cx="392" cy="86" r="24"/>
  <clipPath id="cl"><circle cx="368" cy="86" r="24"/></clipPath>
  <circle cx="392" cy="86" r="24" fill="#1a7d45" clip-path="url(#cl)" opacity="0.55"/>
  <text class="s" x="380" y="128">교집합(공통)</text>

  <!-- MINUS -->
  <text class="t" x="500" y="52">MINUS</text>
  <circle class="ca" cx="490" cy="86" r="24"/><circle class="cb" cx="513" cy="86" r="24" fill="#fff"/>
  <text class="s" x="500" y="128">차집합 A − B</text>

  <text class="note" x="24" y="172">※ UNION은 정렬·중복 제거로 느리고, UNION ALL은 그대로 이어 붙여 빠르다.</text>
  <text class="note" x="24" y="194">   MINUS는 방향이 중요 — A MINUS B ≠ B MINUS A. (표준 SQL은 EXCEPT)</text>
</svg>
