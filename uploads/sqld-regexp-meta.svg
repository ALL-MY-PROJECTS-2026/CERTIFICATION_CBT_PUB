<svg viewBox="0 0 560 240" width="560" height="240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="정규표현식 메타문자. 캐럿은 시작 앵커, 달러는 끝 앵커, 점은 아무 문자 하나, 별은 0회 이상, 대괄호는 문자 집합, 대괄호 안의 캐럿은 부정">
  <defs>
    <style>
      .cap{font:800 14px 'Nanum Gothic',sans-serif;fill:#17324c}
      .box{stroke:#17324c;stroke-width:1.4;fill:#fff}
      .m{font:800 13px 'IBM Plex Mono',monospace;fill:#d62b2b;text-anchor:middle}
      .s{font:400 10.5px 'Nanum Gothic',sans-serif;fill:#4a6580;text-anchor:middle}
      .note{font:400 11px 'IBM Plex Mono',monospace;fill:#4a6580}
    </style>
  </defs>

  <text class="cap" x="24" y="26">주요 메타문자</text>

  <rect class="box" x="24" y="42" width="120" height="48" rx="8"/><text class="m" x="84" y="66">^</text><text class="s" x="84" y="82">문자열 시작</text>
  <rect class="box" x="154" y="42" width="120" height="48" rx="8"/><text class="m" x="214" y="66">$</text><text class="s" x="214" y="82">문자열 끝</text>
  <rect class="box" x="284" y="42" width="120" height="48" rx="8"/><text class="m" x="344" y="66">.</text><text class="s" x="344" y="82">아무 문자 1개</text>
  <rect class="box" x="414" y="42" width="122" height="48" rx="8"/><text class="m" x="475" y="66">*  +  ?</text><text class="s" x="475" y="82">0+ / 1+ / 0~1회</text>

  <rect class="box" x="24" y="100" width="180" height="48" rx="8"/><text class="m" x="114" y="124">[abc]</text><text class="s" x="114" y="140">a·b·c 중 하나</text>
  <rect class="box" x="214" y="100" width="180" height="48" rx="8"/><text class="m" x="304" y="124">[^abc]</text><text class="s" x="304" y="140">a·b·c 가 아닌 것(부정)</text>
  <rect class="box" x="404" y="100" width="132" height="48" rx="8"/><text class="m" x="470" y="124">{2,4}</text><text class="s" x="470" y="140">2~4회 반복</text>

  <text class="note" x="24" y="182">※ 함정 — 앵커(^ $)가 없으면 "부분 일치"도 참. [abc]의 ^ 는 없지만 [^abc]의 ^ 는 '부정'.</text>
  <text class="note" x="24" y="204">※ LIKE의 % _(임의 문자열/1글자)와 헷갈리지 말 것 — 정규식은 . * 등 다른 표기.</text>
</svg>
