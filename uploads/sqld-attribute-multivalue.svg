<svg viewBox="0 0 560 260" width="560" height="260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="다중값 속성을 별도 엔터티로 분리하는 도식. 사원 표의 전화번호 칸에 값이 여러 개 들어간 잘못된 형태를, 사원 표와 사원전화 표로 나눠 한 칸에 값 하나씩 들어가게 고친다">
  <defs>
    <style>
      .cap{font:800 13px 'Nanum Gothic',sans-serif;fill:#17324c}
      .th{fill:#e9f0f5;stroke:#17324c;stroke-width:1.3}
      .td{fill:#fff;stroke:#cbd6de;stroke-width:1.1}
      .bad{fill:#fdeceb;stroke:#d62b2b;stroke-width:1.2}
      .htx{font:800 11px 'Nanum Gothic',sans-serif;fill:#17324c;text-anchor:middle}
      .tx{font:400 11px 'IBM Plex Mono',monospace;fill:#10283d;text-anchor:middle}
      .lbl{font:800 12px 'Nanum Gothic',sans-serif;text-anchor:middle}
      .note{font:400 11px 'IBM Plex Mono',monospace;fill:#4a6580}
      .arw{stroke:#3b5bdb;stroke-width:2;fill:none;marker-end:url(#a)}
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b5bdb"/></marker>
  </defs>

  <text class="lbl" x="120" y="22" fill="#d62b2b">✗ 다중값 (한 칸에 여러 값)</text>
  <rect class="th" x="20" y="32" width="90" height="28"/><text class="htx" x="65" y="50">사원</text>
  <rect class="th" x="110" y="32" width="130" height="28"/><text class="htx" x="175" y="50">전화번호</text>
  <rect class="td" x="20" y="60" width="90" height="30"/><text class="tx" x="65" y="79">김철수</text>
  <rect class="bad" x="110" y="60" width="130" height="30"/><text class="tx" x="175" y="79">010-1, 010-2</text>

  <path class="arw" d="M255 75 L305 75"/>
  <text class="note" x="280" y="66" text-anchor="middle" fill="#3b5bdb">분리</text>

  <text class="lbl" x="435" y="22" fill="#1a7d45">✓ 별도 엔터티 (한 칸에 하나)</text>
  <rect class="th" x="325" y="32" width="90" height="28"/><text class="htx" x="370" y="50">사원</text>
  <rect class="td" x="325" y="60" width="90" height="30"/><text class="tx" x="370" y="79">김철수</text>

  <rect class="th" x="425" y="32" width="115" height="28"/><text class="htx" x="482" y="50">사원전화</text>
  <rect class="td" x="425" y="60" width="115" height="30"/><text class="tx" x="482" y="79">김철수·010-1</text>
  <rect class="td" x="425" y="90" width="115" height="30"/><text class="tx" x="482" y="109">김철수·010-2</text>

  <text class="note" x="20" y="165">※ 한 칸에는 값 하나(원자성) — 다중값 속성은 별도 엔터티(자식 테이블)로 뺀다.</text>
  <text class="note" x="20" y="187">   이 원칙이 곧 제1정규형(1NF)이다.</text>
</svg>
