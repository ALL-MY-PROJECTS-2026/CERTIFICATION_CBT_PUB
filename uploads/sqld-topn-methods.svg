<svg viewBox="0 0 560 220" width="560" height="220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Top N 쿼리 세 가지 방법. 오라클 ROWNUM 인라인뷰, ROW_NUMBER OVER 순위, 표준 FETCH FIRST n ROWS ONLY">
  <defs>
    <style>
      .cap{font:800 14px 'Nanum Gothic',sans-serif;fill:#17324c}
      .box{stroke:#17324c;stroke-width:1.4;fill:#fff}
      .t{font:800 12px 'Nanum Gothic',sans-serif;fill:#17324c}
      .code{font:700 11px 'IBM Plex Mono',monospace;fill:#3b5bdb}
      .s{font:400 10.5px 'Nanum Gothic',sans-serif;fill:#4a6580}
      .note{font:400 11px 'IBM Plex Mono',monospace;fill:#4a6580}
    </style>
  </defs>

  <text class="cap" x="24" y="26">Top-N 상위 N건 뽑는 3가지</text>

  <rect class="box" x="24" y="42" width="512" height="40" rx="8"/>
  <text class="t" x="38" y="60">① ROWNUM (오라클)</text>
  <text class="code" x="230" y="60">정렬 인라인뷰 → WHERE ROWNUM &lt;= N</text>
  <text class="s" x="38" y="76">정렬을 먼저 끝내야 함(함정 주의)</text>

  <rect class="box" x="24" y="90" width="512" height="40" rx="8"/>
  <text class="t" x="38" y="108">② ROW_NUMBER() OVER</text>
  <text class="code" x="230" y="108">... WHERE rn &lt;= N</text>
  <text class="s" x="38" y="124">순위를 매겨 필터 · 파티션별 Top-N도 가능</text>

  <rect class="box" x="24" y="138" width="512" height="40" rx="8"/>
  <text class="t" x="38" y="156">③ FETCH FIRST N ROWS ONLY</text>
  <text class="code" x="290" y="156">ORDER BY … FETCH FIRST N ROWS ONLY</text>
  <text class="s" x="38" y="172">표준 SQL(간결) · 최신 오라클/DB 지원</text>

  <text class="note" x="24" y="204">※ 파티션(그룹)별 Top-N은 ROW_NUMBER() OVER(PARTITION BY …)가 편하다.</text>
</svg>
