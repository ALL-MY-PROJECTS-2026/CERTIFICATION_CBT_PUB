<svg viewBox="0 0 560 250" width="560" height="250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="집계 함수와 NULL. 수당이 100, NULL, 300인 세 행에서 COUNT 별표는 3, COUNT 수당은 2, SUM은 400, AVG는 분모가 2라서 200이 된다">
  <defs>
    <style>
      .cap{font:800 14px 'Nanum Gothic',sans-serif;fill:#17324c}
      .th{fill:#e9f0f5;stroke:#17324c;stroke-width:1.3}
      .td{fill:#fff;stroke:#cbd6de;stroke-width:1.1}
      .nul{fill:#fdeceb;stroke:#d62b2b;stroke-width:1.1}
      .h{font:800 11.5px 'Nanum Gothic',sans-serif;fill:#17324c;text-anchor:middle}
      .x{font:400 12px 'IBM Plex Mono',monospace;fill:#10283d;text-anchor:middle}
      .code{font:700 12px 'IBM Plex Mono',monospace;fill:#10283d}
      .r{font:800 12px 'IBM Plex Mono',monospace;fill:#1a7d45}
      .note{font:400 11px 'IBM Plex Mono',monospace;fill:#4a6580}
    </style>
  </defs>

  <text class="cap" x="24" y="28">집계 함수는 NULL을 뺀다</text>

  <!-- 표 -->
  <rect class="th" x="24" y="44" width="70" height="28"/><text class="h" x="59" y="63">사원</text>
  <rect class="th" x="94" y="44" width="90" height="28"/><text class="h" x="139" y="63">수당</text>
  <rect class="td" x="24" y="72" width="70" height="26"/><text class="x" x="59" y="90">A</text>
  <rect class="td" x="94" y="72" width="90" height="26"/><text class="x" x="139" y="90">100</text>
  <rect class="td" x="24" y="98" width="70" height="26"/><text class="x" x="59" y="116">B</text>
  <rect class="nul" x="94" y="98" width="90" height="26"/><text class="x" x="139" y="116" fill="#d62b2b">NULL</text>
  <rect class="td" x="24" y="124" width="70" height="26"/><text class="x" x="59" y="142">C</text>
  <rect class="td" x="94" y="124" width="90" height="26"/><text class="x" x="139" y="142">300</text>

  <!-- 결과 -->
  <text class="code" x="230" y="64">COUNT(*)</text><text class="r" x="470" y="64">= 3  (전체 행)</text>
  <text class="code" x="230" y="90">COUNT(수당)</text><text class="r" x="470" y="90">= 2  (NULL 제외)</text>
  <text class="code" x="230" y="116">SUM(수당)</text><text class="r" x="470" y="116">= 400</text>
  <text class="code" x="230" y="142">AVG(수당)</text><text class="r" x="470" y="142">= 200  (400 ÷ 2)</text>

  <text class="note" x="24" y="188">※ AVG 분모는 3이 아니라 NULL 뺀 2 — '400÷3=133'으로 계산하면 오답(대표 함정).</text>
  <text class="note" x="24" y="210">   NULL을 0으로 세려면 AVG(NVL(수당,0))처럼 먼저 치환한다.</text>
</svg>
