<svg viewBox="0 0 660 200" width="660" height="200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="회원 표와 주문 표를 회원번호로 INNER JOIN 하면 짝이 있는 행만 남고, 주문이 없는 회원 박(3)은 결과에서 빠진다">
  <defs>
    <marker id="jk-ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#17324c"/></marker>
    <style>
      .hd{fill:#17324c}
      .ht{font:700 12px 'Nanum Gothic',sans-serif;fill:#fff;text-anchor:middle}
      .cell{fill:#fff;stroke:#e2ebf1;stroke-width:1}
      .key{fill:#ffe066;stroke:#e2ebf1;stroke-width:1}
      .ct{font:400 12px 'Nanum Gothic',sans-serif;fill:#17324c;text-anchor:middle}
      .cap{font:800 13px 'Nanum Gothic',sans-serif;fill:#17324c;text-anchor:middle}
      .note{font:400 11px 'IBM Plex Mono',monospace;fill:#4a6580}
      .box{fill:none;stroke:#17324c;stroke-width:1.6}
      .jl{font:700 11.5px 'Nanum Gothic',sans-serif;fill:#17324c;text-anchor:middle}
    </style>
  </defs>

  <!-- 회원 -->
  <text x="80" y="24" class="cap">회원</text>
  <rect class="hd" x="10" y="30" width="140" height="24"/><text x="45" y="46" class="ht">회원번호</text><text x="115" y="46" class="ht">이름</text>
  <rect class="key" x="10" y="54" width="70" height="24"/><text x="45" y="70" class="ct">1</text>
  <rect class="cell" x="80" y="54" width="70" height="24"/><text x="115" y="70" class="ct">김</text>
  <rect class="key" x="10" y="78" width="70" height="24"/><text x="45" y="94" class="ct">2</text>
  <rect class="cell" x="80" y="78" width="70" height="24"/><text x="115" y="94" class="ct">이</text>
  <rect class="key" x="10" y="102" width="70" height="24"/><text x="45" y="118" class="ct">3</text>
  <rect class="cell" x="80" y="102" width="70" height="24"/><text x="115" y="118" class="ct">박</text>
  <rect class="box" x="10" y="30" width="140" height="96"/>

  <!-- 주문 -->
  <text x="250" y="24" class="cap">주문</text>
  <rect class="hd" x="180" y="30" width="140" height="24"/><text x="215" y="46" class="ht">회원번호</text><text x="285" y="46" class="ht">금액</text>
  <rect class="key" x="180" y="54" width="70" height="24"/><text x="215" y="70" class="ct">1</text>
  <rect class="cell" x="250" y="54" width="70" height="24"/><text x="285" y="70" class="ct">5000</text>
  <rect class="key" x="180" y="78" width="70" height="24"/><text x="215" y="94" class="ct">1</text>
  <rect class="cell" x="250" y="78" width="70" height="24"/><text x="285" y="94" class="ct">3000</text>
  <rect class="key" x="180" y="102" width="70" height="24"/><text x="215" y="118" class="ct">2</text>
  <rect class="cell" x="250" y="102" width="70" height="24"/><text x="285" y="118" class="ct">8000</text>
  <rect class="box" x="180" y="30" width="140" height="96"/>

  <!-- 화살표 -->
  <text x="380" y="66" class="jl">INNER JOIN</text>
  <text x="380" y="82" class="note" text-anchor="middle">ON 회원번호</text>
  <path d="M345 96 H415" fill="none" stroke="#17324c" stroke-width="1.5" marker-end="url(#jk-ah)"/>

  <!-- 결과 -->
  <text x="530" y="24" class="cap">결과 (INNER)</text>
  <rect class="hd" x="440" y="30" width="180" height="24"/><text x="485" y="46" class="ht">이름</text><text x="575" y="46" class="ht">금액</text>
  <rect class="cell" x="440" y="54" width="90" height="24"/><text x="485" y="70" class="ct">김</text>
  <rect class="cell" x="530" y="54" width="90" height="24"/><text x="575" y="70" class="ct">5000</text>
  <rect class="cell" x="440" y="78" width="90" height="24"/><text x="485" y="94" class="ct">김</text>
  <rect class="cell" x="530" y="78" width="90" height="24"/><text x="575" y="94" class="ct">3000</text>
  <rect class="cell" x="440" y="102" width="90" height="24"/><text x="485" y="118" class="ct">이</text>
  <rect class="cell" x="530" y="102" width="90" height="24"/><text x="575" y="118" class="ct">8000</text>
  <rect class="box" x="440" y="30" width="180" height="96"/>

  <text x="330" y="150" class="note" text-anchor="middle">※ 주문이 없는 회원 '박'(3)은 INNER JOIN 결과에서 빠진다 — 모두 남기려면 LEFT OUTER JOIN</text>
</svg>
